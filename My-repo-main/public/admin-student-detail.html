<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Details | Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Mentor.css">
  <style>
    .dash-wrap {
      max-width: 900px;
      margin: 2rem auto 5rem;
      padding: 0 1.5rem;
    }
    .profile-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 2rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    .info-box {
      background: var(--bg-elevated);
      padding: 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .course-info-box {
      grid-column: span 2;
    }
    @media (max-width: 520px) {
      .course-info-box {
        grid-column: span 1;
      }
    }
    .progress-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    .progress-table th, .progress-table td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    .progress-table th {
      background: var(--bg-elevated);
      font-weight: 700;
      color: var(--text-muted);
    }
    .report-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .print-report-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 0;
      border-radius: var(--radius-md);
      padding: 0.7rem 1rem;
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: #fff;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(13, 148, 136, 0.2);
    }
    .print-only-report {
      display: none;
    }
    @media print {
      body {
        background: #fff !important;
        color: #111827 !important;
      }
      body > *:not(.print-only-report) {
        display: none !important;
      }
      .print-only-report {
        display: block;
        padding: 2rem;
        font-family: Arial, sans-serif;
      }
      .print-only-report h1 {
        margin: 0 0 1rem;
        font-size: 1.8rem;
        color: #0f766e;
        border-bottom: 2px solid #0f766e;
        padding-bottom: 0.5rem;
      }
      .print-only-report .report-row {
        margin: 0.75rem 0;
        font-size: 1.1rem;
        line-height: 1.5;
      }
      .print-only-report .report-label {
        font-weight: 700;
        color: #374151;
        display: inline-block;
        min-width: 220px;
      }
      .print-only-report .report-value {
        color: #111827;
        font-weight: 600;
      }
      .print-only-report .course-highlight {
        background: #f0fdfa;
        padding: 0.75rem 1rem;
        border-left: 4px solid #0d9488;
        border-radius: 4px;
        margin: 0.75rem 0;
      }
    }
  </style>
</head>
<body class="light-theme">
  <header class="site-header">
    <div class="nav-container">
      <a class="brand-logo" href="/">
        <div class="logo-icon"><i data-lucide="graduation-cap"></i></div>
        <span class="logo-text">Ahmad Saleem</span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-secondary btn-sm" href="/admin/dashboard">&larr; Admin Dashboard</a>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
          <span id="themeIcon"></span>
          <span id="themeLabel">Dark Mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="dash-wrap">
    <div class="report-toolbar">
      <button type="button" class="print-report-btn" onclick="printStudentReport()">
        <i data-lucide="printer"></i>
        <span>Print Full Report</span>
      </button>
    </div>

    <div class="profile-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem;">
        <div>
          <span class="pill-badge" style="background:var(--amber-subtle); color:var(--amber); border-color:var(--amber-border);"><i data-lucide="user"></i> Student Dossier</span>
          <h1 id="stName" style="font-size: 1.85rem; font-weight: 800; margin: 0.5rem 0 0.2rem;">Student Profile</h1>
          <p id="stEmail" style="color: var(--text-muted); font-size: 0.95rem;"></p>
        </div>
        <button class="btn btn-sm" id="btnDeleteStudent" onclick="deleteThisStudent()" style="background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; font-weight:700; display:inline-flex; align-items:center; gap:0.4rem; padding:0.5rem 1rem; border-radius:var(--radius-md); cursor:pointer;">
          <i data-lucide="trash-2"></i> Remove Student
        </button>
      </div>

      <div class="info-grid">
        <div class="info-box">
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">CNIC</div>
          <div id="stCnic" style="font-size:1rem; font-weight:700;">—</div>
        </div>
        <div class="info-box">
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">WhatsApp</div>
          <div id="stWhatsapp" style="font-size:1rem; font-weight:700;">—</div>
        </div>
        <div class="info-box">
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Enrolled Date</div>
          <div id="stJoined" style="font-size:1rem; font-weight:700;">—</div>
        </div>
        <div class="info-box course-info-box">
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Enrolled Course(s)</div>
          <div id="stEnrolledCourses" style="font-size:1rem; font-weight:700; color:var(--primary);">—</div>
        </div>
        <div class="info-box course-info-box">
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Completed Course(s)</div>
          <div id="stCompletedCourses" style="font-size:1rem; font-weight:700; color:var(--emerald);">—</div>
        </div>
      </div>
    </div>

    <div class="profile-card">
      <h2 style="font-size:1.35rem; font-weight:800; margin-bottom:1rem;">Individual Course Progress</h2>
      <table class="progress-table">
        <thead>
          <tr>
            <th>Course Track</th>
            <th>Questions Solved</th>
            <th>Progress</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="stProgressBody">
          <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Loading progress details...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <section class="print-only-report" id="printOnlyReport" aria-hidden="true"></section>

  <script src="/Mentor.js"></script>
  <script>
    function syncThemeUI() {
      const saved = localStorage.getItem('themePreference') || 'light';
      document.body.classList.toggle('dark-theme', saved === 'dark');
      document.body.classList.toggle('light-theme', saved !== 'dark');
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      if (label) label.textContent = saved === 'dark' ? 'Light Mode' : 'Dark Mode';
      if (icon) icon.innerHTML = getIcon(saved === 'dark' ? 'sun' : 'moon');
    }
    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('themePreference', isDark ? 'light' : 'dark');
      syncThemeUI();
    }
    syncThemeUI();

    async function loadStudent() {
      const pathParts = window.location.pathname.split('/');
      const studentId = pathParts[pathParts.length - 1];
      try {
        const res = await fetch(`/api/admin/students/${studentId}`);
        if (!res.ok) throw new Error('Student not found.');
        const data = await res.json();
        const s = data.student;
        const progressList = Array.isArray(data.progress) ? data.progress : [];

        // Only show courses actually enrolled via the Enroll & Start action.
        let enrolledCourses = [];
        if (Array.isArray(s.enrolledCourseTitles) && s.enrolledCourseTitles.length > 0) {
          enrolledCourses = s.enrolledCourseTitles.filter(Boolean);
        } else if (Array.isArray(s.enrolledCourses) && s.enrolledCourses.length > 0) {
          enrolledCourses = s.enrolledCourses.map(c => typeof c === 'string' ? c : (c.title || '')).filter(Boolean);
        }
        window.currentStudentEnrolledCourses = enrolledCourses;

        // Only show courses explicitly marked complete in course progress.
        let completedCourses = [];
        if (Array.isArray(s.completedCourseTitles) && s.completedCourseTitles.length > 0) {
          completedCourses = s.completedCourseTitles.filter(Boolean);
        } else if (Array.isArray(s.completedCourses) && s.completedCourses.length > 0) {
          completedCourses = s.completedCourses.map(c => typeof c === 'string' ? c : (c.title || '')).filter(Boolean);
        }
        window.currentStudentCompletedCourses = completedCourses;

        document.getElementById('stName').textContent = s.full_name || 'Student';
        document.getElementById('stEmail').textContent = s.email || '—';
        document.getElementById('stCnic').textContent = s.cnic || '—';
        document.getElementById('stWhatsapp').textContent = s.whatsapp_number || '—';
        document.getElementById('stJoined').textContent = s.created_at ? new Date(s.created_at).toLocaleDateString() : '—';
        document.getElementById('stEnrolledCourses').textContent = enrolledCourses.length ? enrolledCourses.join(', ') : 'None';
        document.getElementById('stCompletedCourses').textContent = completedCourses.length ? completedCourses.join(', ') : 'None';

        const tbody = document.getElementById('stProgressBody');
        if (progressList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No course progress recorded yet.</td></tr>';
        } else {
          tbody.innerHTML = progressList.map(p => `
            <tr>
              <td><strong>${p.title}</strong></td>
              <td>${p.completedQuestionCount || 0} / ${p.questionCount || 0}</td>
              <td>${p.progressPercentage || 0}%</td>
              <td><span class="badge ${p.completed ? 'badge-emerald' : 'badge-amber'}">${p.completed ? 'Completed' : 'In Progress'}</span></td>
            </tr>
          `).join('');
        }
        if (window.app && app.renderIcons) app.renderIcons();
      } catch (e) {
        alert(e.message);
      }
    }

    function printStudentReport() {
      const report = document.getElementById('printOnlyReport');
      const studentName = document.getElementById('stName').textContent.trim();
      const whatsapp = document.getElementById('stWhatsapp').textContent.trim();
      const enrolledDate = document.getElementById('stJoined').textContent.trim();
      const email = document.getElementById('stEmail').textContent.trim();
      const cnic = document.getElementById('stCnic').textContent.trim();
      const enrolledText = document.getElementById('stEnrolledCourses').textContent.trim();
      const completedText = document.getElementById('stCompletedCourses').textContent.trim();

      report.innerHTML = `
        <h1>Student Progress Dossier & Report</h1>
        <p style="color:#6b7280; margin-bottom:1.5rem;">Printed on: ${new Date().toLocaleDateString()} | Ahmad Saleem Mentorship</p>

        <div class="report-row"><span class="report-label">Student Name:</span> <span class="report-value">${studentName}</span></div>
        <div class="report-row"><span class="report-label">Email:</span> <span class="report-value">${email}</span></div>
        <div class="report-row"><span class="report-label">WhatsApp Number:</span> <span class="report-value">${whatsapp}</span></div>
        <div class="report-row"><span class="report-label">Enrolled Date:</span> <span class="report-value">${enrolledDate}</span></div>
        <div class="report-row"><span class="report-label">CNIC:</span> <span class="report-value">${cnic}</span></div>

        <div class="course-highlight" style="margin-top:1.25rem;">
          <div class="report-row"><span class="report-label">Enrolled Course Name:</span> <span class="report-value" style="color:#0f766e; font-size:1.15rem;">${enrolledText}</span></div>
        </div>

        <div class="course-highlight" style="background:#ecfdf5; border-left-color:#10b981;">
          <div class="report-row"><span class="report-label">Completed Course Name(s):</span> <span class="report-value" style="color:#047857; font-size:1.15rem;">${completedText}</span></div>
        </div>
      `;
      window.print();
    }

    async function deleteThisStudent() {
      const pathParts = window.location.pathname.split('/');
      const studentId = pathParts[pathParts.length - 1];
      const studentName = document.getElementById('stName').textContent || 'this student';
      if (!confirm(`Are you sure you want to permanently remove ${studentName}? This will delete all their enrollments and submissions.`)) return;

      try {
        const res = await fetch(`/api/admin/students/${studentId}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to remove student');
        alert('Student successfully removed.');
        window.location.href = '/admin/dashboard';
      } catch (e) {
        alert(e.message);
      }
    }

    loadStudent();
  </script>
</body>
</html>
