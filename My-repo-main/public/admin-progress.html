<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Progress Overview | Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Mentor.css">
  <style>
    .dash-wrap {
      max-width: 1200px;
      margin: 2rem auto 5rem;
      padding: 0 1.5rem;
    }
    .table-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .progress-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .progress-table th, .progress-table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.875rem;
    }
    .progress-table th {
      background: var(--bg-elevated);
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .matrix-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .print-matrix-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 0;
      border-radius: var(--radius-md);
      padding: 0.7rem 1rem;
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: #fff;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(13, 148, 136, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .print-matrix-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(13, 148, 136, 0.3);
    }
    .print-report {
      display: none;
    }
    @media print {
      body {
        background: #fff !important;
        color: #111827 !important;
      }
      body > *:not(.print-report) {
        display: none !important;
      }
      .print-report {
        display: block;
        padding: 1.5rem;
      }
      .print-report h1 {
        margin: 0 0 0.35rem;
        font-size: 1.6rem;
      }
      .print-report p {
        margin: 0 0 1.25rem;
        color: #4b5563;
      }
      .print-report table {
        width: 100%;
        border-collapse: collapse;
      }
      .print-report th, .print-report td {
        padding: 0.7rem 0.8rem;
        border: 1px solid #d1d5db;
        text-align: left;
      }
      .print-report th {
        background: #f0fdfa;
        color: #115e59;
      }
    }
  </style>
<link rel="stylesheet" href="/responsive.css">
</head>
<body class="light-theme">
  <header class="site-header">
    <div class="nav-container">
      <a class="brand-logo" href="/">
        <div class="logo-icon"><i data-lucide="graduation-cap"></i></div>
        <span class="logo-text">Ahmad Saleem</span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-secondary btn-sm" href="/admin/dashboard">&larr; Admin Dashboard</a>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
          <span id="themeIcon"></span>
          <span id="themeLabel">Dark Mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="dash-wrap">
    <div style="margin-bottom: 2rem;">
      <span class="pill-badge" style="background:var(--amber-subtle); color:var(--amber); border-color:var(--amber-border);"><i data-lucide="shield"></i> Student Progress Matrix</span>
      <h1 style="font-size: 2rem; font-weight: 800; margin: 0.35rem 0 0.15rem;">Cohort Completion & Progress</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Monitor real-time progress across all courses and student accounts.</p>
    </div>

    <div class="matrix-toolbar">
      <button type="button" class="print-matrix-btn" onclick="printStudentMatrix()">
        <i data-lucide="printer"></i>
        <span>Print Student Matrix</span>
      </button>
    </div>

    <div class="table-card">
      <table class="progress-table">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Email</th>
            <th>WhatsApp</th>
            <th>Enrolled Course</th>
            <th>Completed Courses</th>
            <th>Registration Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="cohortTableBody">
          <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Loading student matrix...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <section class="print-report" id="printReport" aria-hidden="true"></section>

  <script src="/Mentor.js"></script>
  <script>
    function syncThemeUI() {
      const saved = localStorage.getItem('themePreference') || 'light';
      document.body.classList.toggle('dark-theme', saved === 'dark');
      document.body.classList.toggle('light-theme', saved !== 'dark');
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      if (label) label.textContent = saved === 'dark' ? 'Light Mode' : 'Dark Mode';
      if (icon) icon.innerHTML = getIcon(saved === 'dark' ? 'sun' : 'moon');
    }
    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('themePreference', isDark ? 'light' : 'dark');
      syncThemeUI();
    }
    syncThemeUI();

    async function loadProgress() {
      try {
        // 1. Fetch the list of students
        const res = await fetch('/api/admin/progress');
        if (!res.ok) {
          window.location.href = '/admin/login';
          return;
        }
        const data = await res.json();
        const tbody = document.getElementById('cohortTableBody');

        if (!data.students || data.students.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No student records found.</td></tr>';
          return;
        }

        // 2. For each student, fetch their profile to get enrolled & completed courses
        const studentsWithDetails = await Promise.all(data.students.map(async (student) => {
          let enrolledCourses = [];
          let completedCourses = [];

          try {
            const profileRes = await fetch(`/api/admin/students/${student.id}`);
            if (profileRes.ok) {
              const profileData = await profileRes.json();
              const profile = profileData.student || {};

              const normalizeCourseTitles = (courses) => {
                if (!Array.isArray(courses)) return [];
                return courses
                  .map(course => {
                    if (typeof course === 'string') return course.trim();
                    if (course && typeof course === 'object') {
                      return course.title || course.name || '';
                    }
                    return '';
                  })
                  .filter(Boolean);
              };

              const fetchedEnrolled = normalizeCourseTitles(profile.enrolledCourseTitles || profile.enrolledCourses || []);
              const fetchedCompleted = normalizeCourseTitles(profile.completedCourseTitles || profile.completedCourses || []);

              if (fetchedEnrolled.length) enrolledCourses = fetchedEnrolled;
              if (fetchedCompleted.length) completedCourses = fetchedCompleted;
            }
          } catch (err) {
            console.warn(`Could not fetch profile for student ${student.id}:`, err);
          }

          if (enrolledCourses.length === 0) {
            try {
              const titles = typeof student.enrolled_course_titles === 'string'
                ? JSON.parse(student.enrolled_course_titles || '[]')
                : (student.enrolled_course_titles || []);
              enrolledCourses = Array.isArray(titles) ? titles.filter(Boolean) : [];
            } catch (e) {
              enrolledCourses = [];
            }
          }

          if (completedCourses.length === 0) {
            try {
              const titles = typeof student.completed_course_titles === 'string'
                ? JSON.parse(student.completed_course_titles || '[]')
                : (student.completed_course_titles || []);
              completedCourses = Array.isArray(titles) ? titles.filter(Boolean) : [];
            } catch (e) {
              completedCourses = [];
            }
          }

          const enrolledText = enrolledCourses.length ? enrolledCourses.join(', ') : '—';
          const completedText = completedCourses.length ? completedCourses.join(', ') : '—';

          return `
            <tr>
              <td><strong>${student.full_name || 'Student'}</strong></td>
              <td>${student.email}</td>
              <td>${student.whatsapp_number || '—'}</td>
              <td>${enrolledText}</td>
              <td>${completedText}</td>
              <td>${new Date(student.created_at).toLocaleDateString()}</td>
              <td>
                <a href="/admin/students/${student.id}" class="btn btn-outline btn-sm">Full Report</a>
              </td>
            </tr>
          `;
        }));

        tbody.innerHTML = studentsWithDetails.join('');

        if (window.app && app.renderIcons) app.renderIcons();
      } catch (err) {
        console.error('Error loading progress:', err);
        document.getElementById('cohortTableBody').innerHTML =
          '<tr><td colspan="7" style="text-align:center; color:var(--rose);">Failed to load student data.</td></tr>';
      }
    }

    function printStudentMatrix() {
      const report = document.getElementById('printReport');
      const students = Array.from(document.querySelectorAll('#cohortTableBody tr'))
        .filter(row => row.querySelectorAll('td').length >= 7)
        .map(row => {
          const cells = row.querySelectorAll('td');
          return {
            name: cells[0].textContent.trim(),
            whatsapp: cells[2].textContent.trim(),
            enrolledCourse: cells[3].textContent.trim(),
            enrolledDate: cells[5].textContent.trim()
          };
        });

      if (!students.length) {
        alert('There are no student records to print.');
        return;
      }

      report.innerHTML = `
        <h1>Student Enrollment Matrix</h1>
        <p>Printed on ${new Date().toLocaleDateString()} | Ahmad Saleem Mentorship</p>
        <table>
          <thead>
            <tr>
              <th>Student Name</th>
              <th>WhatsApp Number</th>
              <th>Enrolled Course Name</th>
              <th>Enrolled Date</th>
            </tr>
          </thead>
          <tbody>${students.map(student => `
            <tr>
              <td><strong>${student.name}</strong></td>
              <td>${student.whatsapp}</td>
              <td>${student.enrolledCourse}</td>
              <td>${student.enrolledDate}</td>
            </tr>
          `).join('')}</tbody>
        </table>
      `;
      window.print();
    }
    loadProgress();
  </script>
</body>
</html>
