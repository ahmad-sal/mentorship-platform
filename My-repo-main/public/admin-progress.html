<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Progress Overview | Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Mentor.css">
  <style>
    /* Shared dashboard/table styling comes from Mentor.css (.dash-wrap, .table-card, .progress-table). */
    .matrix-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .matrix-filters {
      display: grid;
      grid-template-columns: minmax(220px, 1.5fr) repeat(2, minmax(160px, 1fr)) auto;
      gap: 0.85rem;
      align-items: end;
      margin-bottom: 1rem;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
    }
    .matrix-filter-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
    }
    .matrix-filter-field label {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
    }
    .matrix-filter-field select,
    .matrix-filter-field input {
      width: 100%;
      min-height: 2.55rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      color: var(--text-main);
      font: inherit;
    }
    .matrix-filter-field select[multiple] {
      min-height: 5.5rem;
    }
    @media (max-width: 800px) {
      .matrix-filters {
        grid-template-columns: 1fr 1fr;
      }
      .matrix-filter-field:first-child,
      .matrix-filters .btn {
        grid-column: 1 / -1;
      }
    }
    .print-matrix-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 0;
      border-radius: var(--radius-md);
      padding: 0.7rem 1.1rem;
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: #fff;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(13, 148, 136, 0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .print-matrix-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(13, 148, 136, 0.3);
    }
    .print-report {
      display: none;
    }
    @media print {
      body {
        background: #fff !important;
        color: #111827 !important;
      }
      body > *:not(.print-report) {
        display: none !important;
      }
      .print-report {
        display: block;
        padding: 1.5rem;
      }
      .print-report h1 {
        margin: 0 0 0.35rem;
        font-size: 1.6rem;
      }
      .print-report p {
        margin: 0 0 1.25rem;
        color: #4b5563;
      }
      .print-report table {
        width: 100%;
        border-collapse: collapse;
      }
      .print-report th, .print-report td {
        padding: 0.7rem 0.8rem;
        border: 1px solid #d1d5db;
        text-align: left;
      }
      .print-report th {
        background: #f0fdfa;
        color: #115e59;
      }
    }
  </style>
<link rel="stylesheet" href="/responsive.css">
</head>
<body class="light-theme">
  <header class="site-header">
    <div class="nav-container">
      <a class="brand-logo" href="/">
        <div class="logo-icon"><i data-lucide="graduation-cap"></i></div>
        <span class="logo-text">Ahmad Saleem</span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-secondary btn-sm" href="/admin/dashboard">&larr; Admin Dashboard</a>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
          <span id="themeIcon"></span>
          <span id="themeLabel">Dark Mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="dash-wrap">
    <div style="margin-bottom: 2rem;">
      <span class="pill-badge" style="background:var(--amber-subtle); color:var(--amber); border-color:var(--amber-border);"><i data-lucide="shield"></i> Student Progress Matrix</span>
      <h1 style="font-size: 2rem; font-weight: 800; margin: 0.35rem 0 0.15rem;">Cohort Completion & Progress</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Monitor real-time progress across all courses and student accounts.</p>
    </div>

    <div class="matrix-filters" aria-label="Student matrix filters">
      <div class="matrix-filter-field">
        <label for="courseFilter">Course</label>
        <select id="courseFilter" multiple size="3" aria-describedby="courseFilterHint">
          <option value="__all__" selected>All Courses</option>
        </select>
        <small id="courseFilterHint" style="color:var(--text-muted);">Select one or more courses.</small>
      </div>
      <div class="matrix-filter-field">
        <label for="startDateFilter">Starting Date</label>
        <input type="date" id="startDateFilter" />
      </div>
      <div class="matrix-filter-field">
        <label for="endDateFilter">Ending Date</label>
        <input type="date" id="endDateFilter" />
      </div>
      <button type="button" class="btn btn-secondary" onclick="clearMatrixFilters()">Clear Filters</button>
    </div>

    <div class="matrix-toolbar">
      <button type="button" class="print-matrix-btn" onclick="printStudentMatrix()">
        <i data-lucide="printer"></i>
        <span>Print Student Matrix</span>
      </button>
    </div>

    <div class="table-card">
      <table class="progress-table">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Email</th>
            <th>WhatsApp</th>
            <th>Enrolled Course</th>
            <th>Completed Courses</th>
            <th>Registration Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="cohortTableBody">
          <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Loading student matrix...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <section class="print-report" id="printReport" aria-hidden="true"></section>

  <script src="/Mentor.js"></script>
  <script>
    function syncThemeUI() {
      const saved = localStorage.getItem('themePreference') || 'light';
      document.body.classList.toggle('dark-theme', saved === 'dark');
      document.body.classList.toggle('light-theme', saved !== 'dark');
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      if (label) label.textContent = saved === 'dark' ? 'Light Mode' : 'Dark Mode';
      if (icon) icon.innerHTML = getIcon(saved === 'dark' ? 'sun' : 'moon');
    }
    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('themePreference', isDark ? 'light' : 'dark');
      syncThemeUI();
    }
    syncThemeUI();

    let matrixStudents = [];
    let matrixCourses = [];
    let previousCourseSelection = ['__all__'];

    function normalizeCourseTitles(courses) {
      if (!Array.isArray(courses)) return [];
      return courses
        .map(course => {
          if (typeof course === 'string') return course.trim();
          if (course && typeof course === 'object') return course.title || course.name || '';
          return '';
        })
        .filter(Boolean);
    }

    function parseCourseTitles(value) {
      if (Array.isArray(value)) return normalizeCourseTitles(value);
      if (typeof value !== 'string') return [];
      try {
        return normalizeCourseTitles(JSON.parse(value || '[]'));
      } catch (e) {
        return [];
      }
    }

    function populateCourseFilter() {
      const courseFilter = document.getElementById('courseFilter');
      const titles = [...new Set(matrixCourses.map(course => course.title).filter(Boolean))];
      courseFilter.innerHTML = '<option value="__all__">All Courses</option>' + titles
        .map(title => `<option value="${title.replace(/"/g, '&quot;')}">${title}</option>`)
        .join('');
      courseFilter.options[0].selected = true;
      previousCourseSelection = ['__all__'];
    }

    function getSelectedCourses() {
      return Array.from(document.getElementById('courseFilter').selectedOptions)
        .map(option => option.value)
        .filter(value => value !== '__all__');
    }

    function getFilteredStudents() {
      const selectedCourses = getSelectedCourses().map(course => course.toLowerCase());
      const startDate = document.getElementById('startDateFilter').value;
      const endDate = document.getElementById('endDateFilter').value;

      return matrixStudents.filter(student => {
        const studentCourses = [...student.enrolledCourses, ...student.completedCourses]
          .map(course => course.toLowerCase());
        const matchesCourse = !selectedCourses.length || selectedCourses.some(course => studentCourses.includes(course));
        const registrationDate = String(student.created_at || '').slice(0, 10);
        const matchesStartDate = !startDate || registrationDate >= startDate;
        const matchesEndDate = !endDate || registrationDate <= endDate;
        return matchesCourse && matchesStartDate && matchesEndDate;
      });
    }

    function renderStudentMatrix() {
      const students = getFilteredStudents();
      const tbody = document.getElementById('cohortTableBody');

      if (!students.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No student records match the selected filters.</td></tr>';
        return;
      }

      tbody.innerHTML = students.map(student => {
        const enrolledText = student.enrolledCourses.length ? student.enrolledCourses.join(', ') : '—';
        const completedText = student.completedCourses.length ? student.completedCourses.join(', ') : '—';
        return `
          <tr>
            <td><strong>${student.full_name || 'Student'}</strong></td>
            <td>${student.email}</td>
            <td>${student.whatsapp_number || '—'}</td>
            <td>${enrolledText}</td>
            <td>${completedText}</td>
            <td>${new Date(student.created_at).toLocaleDateString()}</td>
            <td>
              <a href="/admin/students/${student.id}" class="btn btn-outline btn-sm">Full Report</a>
            </td>
          </tr>
        `;
      }).join('');

      if (window.app && app.renderIcons) app.renderIcons();
    }

    function handleCourseFilterChange() {
      const courseFilter = document.getElementById('courseFilter');
      const selected = Array.from(courseFilter.selectedOptions).map(option => option.value);
      const hadAll = previousCourseSelection.includes('__all__');
      const hasAll = selected.includes('__all__');

      if (hasAll && (!hadAll || selected.length === 1)) {
        Array.from(courseFilter.options).forEach(option => { option.selected = option.value === '__all__'; });
      } else if (hasAll && hadAll && selected.length > 1) {
        Array.from(courseFilter.options).forEach(option => { if (option.value === '__all__') option.selected = false; });
      }

      previousCourseSelection = Array.from(courseFilter.selectedOptions).map(option => option.value);
      renderStudentMatrix();
    }

    function clearMatrixFilters() {
      const courseFilter = document.getElementById('courseFilter');
      Array.from(courseFilter.options).forEach(option => { option.selected = option.value === '__all__'; });
      document.getElementById('startDateFilter').value = '';
      document.getElementById('endDateFilter').value = '';
      previousCourseSelection = ['__all__'];
      renderStudentMatrix();
    }

    async function loadProgress() {
      try {
        const res = await fetch('/api/admin/progress');
        if (!res.ok) {
          window.location.href = '/admin/login';
          return;
        }
        const data = await res.json();
        matrixCourses = Array.isArray(data.courses) ? data.courses : [];
        populateCourseFilter();

        matrixStudents = await Promise.all((data.students || []).map(async (student) => {
          let enrolledCourses = parseCourseTitles(student.enrolled_course_titles);
          let completedCourses = parseCourseTitles(student.completed_course_titles);

          try {
            const profileRes = await fetch(`/api/admin/students/${student.id}`);
            if (profileRes.ok) {
              const profileData = await profileRes.json();
              const profile = profileData.student || {};
              const fetchedEnrolled = normalizeCourseTitles(profile.enrolledCourseTitles || profile.enrolledCourses || []);
              const fetchedCompleted = normalizeCourseTitles(profile.completedCourseTitles || profile.completedCourses || []);
              if (fetchedEnrolled.length) enrolledCourses = fetchedEnrolled;
              if (fetchedCompleted.length) completedCourses = fetchedCompleted;
            }
          } catch (err) {
            console.warn(`Could not fetch profile for student ${student.id}:`, err);
          }

          return { ...student, enrolledCourses, completedCourses };
        }));

        renderStudentMatrix();
      } catch (err) {
        console.error('Error loading progress:', err);
        document.getElementById('cohortTableBody').innerHTML =
          '<tr><td colspan="7" style="text-align:center; color:var(--rose);">Failed to load student data.</td></tr>';
      }
    }

    function printStudentMatrix() {
      const report = document.getElementById('printReport');
      const students = getFilteredStudents();

      if (!students.length) {
        alert('There are no student records to print.');
        return;
      }

      report.innerHTML = `
        <h1>Student Enrollment Matrix</h1>
        <p>Printed on ${new Date().toLocaleDateString()} | Ahmad Saleem Mentorship</p>
        <table>
          <thead>
            <tr>
              <th>Student Name</th>
              <th>WhatsApp Number</th>
              <th>Completed Courses</th>
              <th>Enrolled Date</th>
            </tr>
          </thead>
          <tbody>${students.map(student => `
            <tr>
              <td><strong>${student.full_name || 'Student'}</strong></td>
              <td>${student.whatsapp_number || '—'}</td>
              <td>${student.completedCourses.length ? student.completedCourses.join(', ') : '—'}</td>
              <td>${new Date(student.created_at).toLocaleDateString()}</td>
            </tr>
          `).join('')}</tbody>
        </table>
      `;
      window.print();
    }

    document.getElementById('courseFilter').addEventListener('change', handleCourseFilterChange);
    document.getElementById('startDateFilter').addEventListener('change', renderStudentMatrix);
    document.getElementById('endDateFilter').addEventListener('change', renderStudentMatrix);
    loadProgress();
  </script>
</body>
</html>
