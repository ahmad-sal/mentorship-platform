<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Ahmad Saleem Mentorship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Mentor.css">
  <style>
    .auth-wrap {
      max-width: 440px;
      margin: 40px auto;
      padding: 0 1rem;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0.5rem 0 0.25rem;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-subtle);
    }
    .auth-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .alert-error {
      background: var(--rose-subtle);
      border: 1px solid var(--rose-border);
      color: var(--rose);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: none;
    }
    .badge-admin {
      background: var(--amber-subtle);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }
  </style>
</head>
<body class="light-theme">
  <header class="site-header">
    <div class="nav-container">
      <a class="brand-logo" href="/">
        <div class="logo-icon"><i data-lucide="graduation-cap"></i></div>
        <span class="logo-text">Ahmad Saleem</span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-text" href="/">Back to Home</a>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
          <span id="themeIcon"></span>
          <span id="themeLabel">Dark Mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <span class="pill-badge badge-admin"><i data-lucide="shield"></i> Mentor & Admin</span>
        <h1>Admin Portal</h1>
        <p>Sign in to manage curriculum, review submissions, and view students</p>
      </div>

      <div id="errorAlert" class="alert-error"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="email">Admin Email</label>
          <input type="email" id="email" class="form-control"   required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
          <span>Access Dashboard</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p><a href="/login">&larr; Return to Student Login</a></p>
      </div>
    </div>
  </main>

  <script src="/Mentor.js"></script>
  <script>
    function syncThemeUI() {
      const saved = localStorage.getItem('themePreference') || 'light';
      document.body.classList.toggle('dark-theme', saved === 'dark');
      document.body.classList.toggle('light-theme', saved !== 'dark');
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      if (label) label.textContent = saved === 'dark' ? 'Light Mode' : 'Dark Mode';
      if (icon) icon.innerHTML = getIcon(saved === 'dark' ? 'sun' : 'moon');
    }
    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('themePreference', isDark ? 'light' : 'dark');
      syncThemeUI();
    }
    syncThemeUI();

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorAlert');
      const btn = document.getElementById('submitBtn');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span>Verifying Admin...</span>';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Admin verification failed.');

        window.location.href = '/admin/dashboard';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Access Dashboard</span>' + getIcon('arrow-right');
      }
    });
  </script>
</body>
</html>
