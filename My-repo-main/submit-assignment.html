<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Assignment | Ahmad Saleem Mentorship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7fbf9;--surface:#fff;--text:#142d25;--muted:#60786d;--line:#d7e8df;--primary:#138a5b;--soft:#e9f8f0;--shadow:0 18px 45px rgba(19,138,91,.12)}
body.dark{--bg:#0d2118;--surface:#153125;--text:#effff5;--muted:#a8c9b6;--line:#2d5842;--soft:rgba(19,138,91,.2);--shadow:0 18px 45px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.top{max-width:1080px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;color:var(--primary)}button,.back,.submit{border:1px solid var(--line);border-radius:10px;padding:10px 15px;background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}.wrap{max-width:780px;margin:48px auto;padding:0 22px}.back{display:inline-block;background:var(--primary);color:#fff;border:0;margin-bottom:30px}.eyebrow{display:inline-block;padding:7px 12px;border-radius:99px;background:var(--soft);color:var(--primary);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;margin:18px 0 14px;letter-spacing:-.04em}.hero p{color:var(--muted);font-size:1.08rem}.form-panel{margin-top:34px;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.form-panel h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:grid;gap:7px;font-weight:700;font-size:.88rem}input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}textarea{min-height:130px;resize:vertical}.full{grid-column:1/-1}.submit{margin-top:20px;background:var(--primary);border-color:var(--primary);color:#fff}.status{display:none;margin-top:18px;padding:14px;border-radius:10px;background:var(--soft);color:var(--primary);font-weight:700}.status.show{display:block}.note{color:var(--muted);font-size:.86rem}.footer{text-align:center;color:var(--muted);padding:35px 20px}@media(max-width:650px){.top{padding:14px 16px}.wrap{margin-top:28px;padding:0 16px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
body.theme-youtube{--bg:#fff7f7;--text:#3a1115;--muted:#80565b;--line:#f0d5d8;--primary:#dc2626;--soft:#fff0f1;--shadow:0 18px 45px rgba(220,38,38,.14)}body.theme-canva{--bg:#f5fcf7;--text:#123222;--muted:#5f7969;--line:#d6eadb;--primary:#35a66a;--soft:#eaf8ee;--shadow:0 18px 45px rgba(53,166,106,.13)}body.theme-wordpress{--bg:#f2f9ff;--text:#10283f;--muted:#5d748d;--line:#d5e6f4;--primary:#2d8fd5;--soft:#e7f4ff;--shadow:0 18px 45px rgba(45,143,213,.13)}body.theme-ai{--bg:linear-gradient(135deg,#fff7ed,#f5f3ff 48%,#ecfeff);--text:#24163f;--muted:#706781;--line:#e4d9f1;--primary:#7c3aed;--soft:linear-gradient(135deg,#fce7f3,#ede9fe,#cffafe);--shadow:0 18px 45px rgba(100,65,150,.14)}body.dark{--bg:#0d2118;--surface:#153125;--text:#effff5;--muted:#a8c9b6;--line:#2d5842;--soft:rgba(19,138,91,.2);--shadow:0 18px 45px rgba(0,0,0,.35)}
body{background-image:radial-gradient(circle at 0% 0%,rgba(19,138,91,.08),transparent 32%),linear-gradient(135deg,transparent 55%,rgba(19,138,91,.04))}.form-panel{border-color:color-mix(in srgb,var(--primary) 18%,var(--line));box-shadow:0 20px 45px rgba(19,138,91,.14)}.submit{box-shadow:0 8px 18px rgba(19,138,91,.2);transition:transform .2s ease,filter .2s ease,box-shadow .2s ease}.submit:hover{transform:translateY(-2px);filter:brightness(.97);box-shadow:0 12px 24px rgba(19,138,91,.28)}
</style>
</head>
<body>
<header class="top"><a class="brand" href="Mentor.html">Ahmad Saleem Mentorship</a><button id="themeBtn"><span id="themeIcon">Dark Mode</span></button></header>
<main class="wrap">
<a class="back" href="javascript:history.back()">&larr; Back to course</a>
<section class="hero"><span class="eyebrow">Submit Assignment</span><h1 id="pageTitle">Send your course assignment.</h1><p>Share your work with the course team for review and feedback.</p></section>
<section class="form-panel"><h2>Assignment details</h2><p class="note">Complete the form and attach your assignment file.</p><form id="assignmentForm"><div class="form-grid"><label>Student name<input required name="student" type="text" placeholder="Your full name"></label><label>Email address<input required name="email" type="email" placeholder="you@example.com"></label><label>Course<select required name="course" id="courseSelect"><option>Artificial Intelligence</option><option>Canva</option><option>WordPress</option><option>YouTube Automation</option></select></label><label>Assignment title<input required name="title" type="text" placeholder="Project or assignment name"></label><label class="full">Notes<textarea name="notes" placeholder="Add a short note for your mentor"></textarea></label><label class="full">Assignment file<input required name="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip,.png,.jpg,.jpeg"></label></div><button class="submit" type="submit">Submit assignment</button><div class="status" id="status" role="status"></div></form></section>
</main><footer class="footer">&copy; 2026 Mentor Ahmad Saleem</footer>
<script>
const params=new URLSearchParams(location.search);const course=params.get('course');const select=document.getElementById('courseSelect');if(course){const label=decodeURIComponent(course);document.getElementById('pageTitle').textContent='Submit your '+label+' assignment.';[...select.options].forEach(option=>{if(option.text.toLowerCase()===label.toLowerCase())select.value=option.text});const theme=label.toLowerCase().includes('youtube')?'theme-youtube':label.toLowerCase().includes('artificial')?'theme-ai':label.toLowerCase().includes('canva')?'theme-canva':'theme-wordpress';document.body.classList.add(theme)}
document.getElementById('assignmentForm').onsubmit=event=>{event.preventDefault();const status=document.getElementById('status');status.textContent='Your assignment is ready to be sent for review. Connect this form to your preferred storage or email service to receive uploads.';status.classList.add('show')};
const body=document.body,button=document.getElementById('themeBtn'),saved=localStorage.getItem('themePreference');if(saved==='dark')body.classList.add('dark');function sync(){const dark=body.classList.contains('dark');document.getElementById('themeIcon').textContent=dark?'Light Mode':'Dark Mode'}sync();button.onclick=()=>{const dark=body.classList.toggle('dark');localStorage.setItem('themePreference',dark?'dark':'light');sync()};
</script>
</body>
</html>
